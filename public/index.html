<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReUse Campus – Chợ đồ cũ sinh viên</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="hero">
      <h1>Đồ cũ của bạn, kho báu của người khác</h1>
      <p>Mua bán, trao đổi và tặng lại đồ dùng giữa sinh viên: giáo trình, đồ phòng trọ, đồ điện tử… Tiết kiệm tiền, giảm rác thải.</p>
      <a class="btn" href="/post.html">＋ Đăng tin ngay</a>
    </section>

    <form id="search-form" class="filters" autocomplete="off">
      <label class="q-field">Từ khoá
        <input name="q" type="search" placeholder="Bạn đang tìm gì? (giáo trình, quạt, xe đạp…)">
      </label>
      <label>Danh mục
        <select name="category"><option value="">Tất cả danh mục</option></select>
      </label>
      <label>Hình thức
        <select name="type"><option value="">Tất cả</option></select>
      </label>
      <label>Khoảng giá (đ)
        <div class="price-range">
          <input name="min" type="number" min="0" step="1000" placeholder="Từ">
          <span>–</span>
          <input name="max" type="number" min="0" step="1000" placeholder="Đến">
        </div>
      </label>
      <label>Sắp xếp
        <select name="sort">
          <option value="newest">Mới nhất</option>
          <option value="price_asc">Giá thấp → cao</option>
          <option value="price_desc">Giá cao → thấp</option>
          <option value="oldest">Cũ nhất</option>
        </select>
      </label>
      <button class="btn primary" type="submit">🔍 Tìm</button>
      <div class="price-presets" id="price-presets">
        <span class="lbl">Giá nhanh:</span>
      </div>
    </form>

    <div class="cat-chips" id="cat-chips"></div>

    <div class="result-bar">
      <strong id="result-count">Đang tải…</strong>
      <button type="button" class="btn sm" id="reset-btn">Xoá bộ lọc</button>
    </div>
    <div class="grid" id="results"></div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
